# Integra OpTogether con el proxy Caddy compartido del servidor (patrón <proyecto>_web).
# Crea la red `optogether_web`; el proxy se une a ella igual que a coolmena_web, kevimo_web, etc.
# Activación en .env:  COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
# Alias únicos para no chocar con servicios `api`/`rest` de otros proyectos.
services:
  rest:
    networks:
      default:
      web:
        aliases: [optogether-rest]
  api:
    networks:
      default:
      web:
        aliases: [optogether-api]

networks:
  web:
    name: optogether_web
