# OpTogether · backend autoalojado
# Uso:  cp .env.example .env  (edita los valores)  &&  docker compose up -d --build
name: optogether

services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_DB: optogether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: UTC
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=optogether
      -c cron.timezone=UTC
      -c log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d optogether"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Aplica migraciones pendientes y fija contraseñas de roles; termina y sale.
  migrate:
    build: ./api
    command: ["node", "src/migrate.mjs"]
    restart: "no"
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/optogether
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?Define AUTHENTICATOR_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Define API_DB_PASSWORD}
    volumes:
      - ./db/migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  rest:
    image: postgrest/postgrest:v13.0.4
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/optogether
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (mínimo 32 caracteres)}
      PGRST_DB_MAX_ROWS: "10000"
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_OPENAPI_MODE: disabled
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://api_service:${API_DB_PASSWORD}@db:5432/optogether
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:?Define PUBLIC_URL (https://tu-dominio)}
      FILES_DIR: /data/receipts
      SIGNUP_ALLOWLIST: ${SIGNUP_ALLOWLIST:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    volumes:
      - receipts:/data/receipts
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - rest

volumes:
  pgdata:
  receipts:
  caddy_data:
  caddy_config:
