name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App · typecheck, lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src tests
      - run: npm test -- --ci

  backend:
    name: Backend · PostgreSQL + PostgREST + API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pruebas unitarias de la API
        working-directory: server/api
        run: npm ci && npm test
      - name: Levantar la pila (secretos efímeros)
        working-directory: server
        run: |
          cat > .env <<EOT
          DOMAIN=:80
          HTTP_PORT=8088
          HTTPS_PORT=8443
          PUBLIC_URL=http://localhost:8088
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          AUTHENTICATOR_PASSWORD=$(openssl rand -hex 24)
          API_DB_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$(openssl rand -hex 32)
          EOT
          docker compose --profile caddy up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:8088/health && break; sleep 3; done
          curl -sf http://localhost:8088/health
      - name: Pruebas pgTAP
        run: sh server/db/test.sh
      - run: npm ci
      - name: Pruebas de integración
        run: npm run test:integration
      - name: Logs ante fallo
        if: failure()
        working-directory: server
        run: docker compose logs --tail 100

  # Despliegue continuo: solo en push a main y solo si las pruebas pasan.
  # - Cambios de JavaScript → EAS Update al canal `preview` (el APK instalado se actualiza solo).
  # - Cambios nativos (huella distinta) → nuevo APK con EAS Build.
  deploy:
    name: Despliegue continuo (EAS)
    needs: [app, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Verificar EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::Falta el secreto EXPO_TOKEN; se omite el despliegue."
            exit 0
          fi
      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        if: env.EXPO_TOKEN != ''
      - name: Publicar actualización o compilar APK según la huella nativa
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        with:
          profile: preview
          branch: preview
          environment: preview
          platform: android
