name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App · typecheck, lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src tests
      - run: npm test -- --ci

  backend:
    name: Backend · PostgreSQL + PostgREST + API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pruebas unitarias de la API
        working-directory: server/api
        run: npm ci && npm test
      - name: Levantar la pila (secretos efímeros)
        working-directory: server
        run: |
          cat > .env <<EOT
          DOMAIN=:80
          HTTP_PORT=8088
          HTTPS_PORT=8443
          PUBLIC_URL=http://localhost:8088
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          AUTHENTICATOR_PASSWORD=$(openssl rand -hex 24)
          API_DB_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$(openssl rand -hex 32)
          EOT
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:8088/health && break; sleep 3; done
          curl -sf http://localhost:8088/health
      - name: Pruebas pgTAP
        run: sh server/db/test.sh
      - run: npm ci
      - name: Pruebas de integración
        run: npm run test:integration
      - name: Logs ante fallo
        if: failure()
        working-directory: server
        run: docker compose logs --tail 100
